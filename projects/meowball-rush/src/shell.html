<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>魔女猫球 · Meowball Rush</title>
  <style>
    :root {
      --ink: #2b1e3a;
      --cream: #fff9ef;
      --violet: #8b5cf6;
      --pink: #ff6fb5;
      --gold: #ffcf40;
      --cyan: #38e8ff;
      --mint: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1b122b; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    #app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    #gl-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* ===== RESPONSIVE ARCADE HUD ===== */
    #hud {
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    }
    #hud[hidden] { display: none; }
    .hud-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .hud-pill {
      pointer-events: auto;
      background: rgba(43, 30, 58, 0.84); border: 2.5px solid rgba(255,255,255,0.85);
      border-radius: 999px; padding: 5px 12px; font-weight: 900; font-size: 12px;
      box-shadow: 0 4px 0 rgba(43, 30, 58, 0.72); backdrop-filter: blur(6px);
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .timer-box {
      background: linear-gradient(180deg, #fff9ef, #fde6ba); color: var(--ink);
      border: 3px solid var(--ink); border-radius: 18px; padding: 5px 18px;
      text-align: center; box-shadow: 0 5px 0 var(--ink);
    }
    .timer-box.urgent { background: linear-gradient(180deg, #ff7a99, #ff3868); color: #fff; animation: pulse 0.45s infinite alternate; }
    .timer-lbl { font-size: 9px; font-weight: 900; opacity: 0.75; letter-spacing: 0.08em; }
    .timer-val { font-size: 26px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
    @keyframes pulse { to { transform: scale(1.06); } }

    .hud-actions { display: flex; gap: 6px; align-items: center; }
    .hud-btn {
      pointer-events: auto; cursor: pointer;
      background: rgba(43, 30, 58, 0.88); color: #fff; border: 2.5px solid rgba(255,255,255,0.88);
      border-radius: 14px; min-width: 38px; height: 38px; padding: 0 10px;
      font-size: 14px; font-weight: 900; box-shadow: 0 4px 0 rgba(43, 30, 58, 0.75);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hud-btn:active { transform: translateY(2px); }
    .hud-btn.active { background: #10b981; border-color: #fff; }

    .hud-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .speed-card {
      background: rgba(43, 30, 58, 0.84); border: 2.5px solid rgba(255,255,255,0.55);
      border-radius: 16px; padding: 7px 12px; min-width: 112px;
    }
    .speed-val { font-size: 18px; font-weight: 900; color: var(--cyan); }
    .speed-sub { font-size: 10px; font-weight: 800; color: #e2d9f3; }
    .ctrl-hint {
      background: rgba(43, 30, 58, 0.78); border: 2px solid rgba(255,255,255,0.32);
      border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 800; color: #fef3c7;
    }

    #toast {
      position: absolute; top: 88px; left: 50%; transform: translateX(-50%);
      z-index: 45; pointer-events: none;
      background: linear-gradient(90deg, #ff6fb5, #8b5cf6); color: #fff;
      border: 3px solid var(--ink); border-radius: 999px; padding: 8px 18px;
      font-size: 13px; font-weight: 900; box-shadow: 0 5px 0 var(--ink);
      white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    }
    #toast[hidden] { display: none; }

    /* ===== WITCHSPRING FULL-SCREEN STORYBOOK LOBBY HUB ===== */
    .overlay {
      position: absolute; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      background-size: cover; background-position: center;
    }
    .overlay[hidden] { display: none; }
    #lobby-screen {
      padding: max(14px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    }
    #lobby-screen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(24,14,42,0.72) 0%, rgba(24,14,42,0.18) 34%, rgba(24,14,42,0.25) 56%, rgba(24,14,42,0.92) 92%);
    }
    #lobby-screen > * { position: relative; z-index: 2; width: min(500px, 100%); }

    .lobby-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .res-chip {
      background: rgba(255, 249, 239, 0.92); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 999px;
      padding: 5px 12px; font-size: 12px; font-weight: 900;
      box-shadow: 0 3px 0 var(--ink); display: inline-flex; align-items: center; gap: 5px;
    }
    .gyro-pill {
      cursor: pointer; background: rgba(43, 30, 58, 0.88); color: #fef3c7;
      border: 2.5px solid rgba(255,255,255,0.78); border-radius: 999px;
      padding: 5px 12px; font-size: 11.5px; font-weight: 900;
      box-shadow: 0 3px 0 var(--ink);
    }
    .gyro-pill.on { background: #10b981; color: #052e16; border-color: var(--ink); }

    .hero-emblem { text-align: center; margin: auto 0 10px; }
    .badge-tag {
      display: inline-block; background: linear-gradient(90deg, #ff6fb5, #8b5cf6); color: #fff;
      border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px 14px;
      font-size: 11px; font-weight: 900; letter-spacing: 0.08em; box-shadow: 0 3px 0 var(--ink);
    }
    .lobby-title {
      font-size: clamp(32px, 7vw, 44px); font-weight: 900; margin-top: 6px; color: #fff;
      text-shadow: 0 4px 0 var(--ink), 0 0 26px rgba(192, 132, 252, 0.72);
      letter-spacing: 0.02em;
    }
    .lobby-sub {
      font-size: 12px; font-weight: 800; color: #fef3c7; margin-top: 4px;
      padding: 0 10px; line-height: 1.4; max-width: 100%;
      text-shadow: 0 2px 0 var(--ink);
    }

    .lobby-drawer {
      background: rgba(255, 249, 239, 0.94); color: var(--ink);
      border: 3.5px solid var(--ink); border-radius: 26px; padding: 12px 14px 14px;
      box-shadow: 0 8px 0 var(--ink), 0 22px 48px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }
    .hub-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .htab {
      border: 2.5px solid #d9cbe8; border-radius: 14px; padding: 8px;
      background: #f5eefc; color: #6b5582; font-size: 13px; font-weight: 900; cursor: pointer;
    }
    .htab.active {
      background: linear-gradient(90deg, #8b5cf6, #ec4899); color: #fff;
      border-color: var(--ink); box-shadow: 0 3px 0 var(--ink);
    }
    .tab-pane[hidden] { display: none; }

    /* Progressive Difficulty Track Cards */
    .track-cards { display: flex; flex-direction: column; gap: 7px; }
    .tcard {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #fff; border: 2.5px solid #d9cbe8; border-radius: 16px;
      padding: 9px 12px; cursor: pointer; text-align: left; color: var(--ink);
      transition: transform 0.1s, border-color 0.15s;
    }
    .tcard:active { transform: scale(0.985); }
    .tcard.active { border-color: var(--pink); background: #fff0f7; box-shadow: 0 4px 0 var(--pink); }
    .tcard.locked { opacity: 0.62; background: #ede7f3; }
    .tcard-title { font-size: 13.5px; font-weight: 900; }
    .tcard-sub { font-size: 11px; font-weight: 700; color: #6b5582; margin-top: 2px; }
    .tcard-right { text-align: right; flex-shrink: 0; }
    .tcard-diff { font-size: 12px; color: #f59e0b; letter-spacing: 1px; }
    .tcard-best { font-size: 10px; font-weight: 900; color: #10b981; margin-top: 2px; }

    /* Cat Wardrobe Grid + 4 Stat Bars */
    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .cat-btn {
      background: #fff; border: 2.5px solid #d9cbe8; border-radius: 14px;
      padding: 7px 5px; cursor: pointer; text-align: center; color: var(--ink);
    }
    .cat-btn.active { border-color: var(--violet); background: #f3e8ff; box-shadow: 0 3px 0 var(--violet); }
    .cat-btn.locked { opacity: 0.55; background: #ede7f3; }
    .cat-dot {
      width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 4px;
      border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .cat-name { font-size: 11px; font-weight: 900; }
    .cat-stats-card {
      margin-top: 8px; background: #f6effc; border: 2px solid #d9cbe8;
      border-radius: 14px; padding: 8px 10px;
    }
    .stat-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 6px; }
    .sbar-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 900; color: #5b4375; }
    .sbar-track { flex: 1; height: 7px; background: #e2d5f0; border-radius: 999px; overflow: hidden; }
    .sbar-fill { height: 100%; background: linear-gradient(90deg, #8b5cf6, #ec4899); border-radius: 999px; }

    .cta-row { display: flex; gap: 8px; margin-top: 10px; }
    .gbtn {
      flex: 1; border: 3px solid var(--ink); border-radius: 16px; padding: 12px 10px;
      font-size: 15px; font-weight: 900; cursor: pointer;
      box-shadow: 0 5px 0 var(--ink); transition: transform 0.1s;
    }
    .gbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
    .gbtn-play { background: linear-gradient(180deg, #6ef2a9, #10b981); color: #072b1f; }
    .gbtn-gold { background: linear-gradient(180deg, #ffe26a, #f59e0b); color: #2b1800; }
    .gbtn-dark { background: #2b1e3a; color: #fff; }

    /* Center Modal (Pause & Result) */
    .center-overlay {
      justify-content: center; padding: 18px;
      background: rgba(20, 12, 34, 0.72); backdrop-filter: blur(6px);
    }
    .modal-box {
      background: rgba(255, 249, 239, 0.96); color: var(--ink);
      border: 3.5px solid var(--ink); border-radius: 26px; padding: 20px 18px;
      width: min(380px, 100%); text-align: center;
      box-shadow: 0 10px 0 var(--ink), 0 24px 60px rgba(0,0,0,0.5);
    }
    .res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 16px; }
    .res-stat { background: #f3e8ff; border: 2px solid #d9cbe8; border-radius: 14px; padding: 10px; }
    .res-stat .k { font-size: 11px; font-weight: 800; color: #6b5582; }
    .res-stat .v { font-size: 20px; font-weight: 900; color: var(--ink); margin-top: 2px; }
    .slider-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #f3e8ff; border: 2px solid #d9cbe8; border-radius: 14px;
      padding: 9px 12px; margin: 12px 0; font-size: 12px; font-weight: 900;
    }
    .slider-row input { flex: 1; accent-color: var(--violet); }

    @media (max-width: 520px) {
      .hud-pill { font-size: 11px; padding: 4px 9px; }
      .timer-val { font-size: 22px; }
      .ctrl-hint { display: none; }
      .gbtn { font-size: 14px; padding: 11px 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="gl-canvas"></canvas>

    <!-- Responsive Arcade HUD with Explicit Pause & Gyro Toggle -->
    <div id="hud" hidden>
      <div class="hud-top">
        <div class="hud-pill" id="hud-track">🌸 01 · 空中花园</div>
        <div class="timer-box" id="timer-box">
          <div class="timer-lbl">TIME LEFT</div>
          <div class="timer-val" id="hud-time">48.0</div>
        </div>
        <div class="hud-actions">
          <div class="hud-pill" id="hud-stars">⭐ 0</div>
          <button class="hud-btn" id="btn-hud-gyro" title="手机陀螺仪开关">📱</button>
          <button class="hud-btn" id="btn-mute" title="静音">🔊</button>
          <button class="hud-btn" id="btn-pause" title="暂停 (Esc)">⏸</button>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="speed-card">
          <div class="speed-val" id="hud-speed">0 km/h</div>
          <div class="speed-sub" id="hud-status">🐾 全速滚动中</div>
        </div>
        <div class="ctrl-hint" id="ctrl-hint">🖱️ 点击锁鼠推球 · WASD · 手机滑动/陀螺仪 · Esc 暂停</div>
      </div>
    </div>

    <div id="toast" hidden>✨ 提示</div>

    <!-- WitchSpring Mobile/PC Storybook Lobby Hub -->
    <div class="overlay" id="lobby-screen">
      <div class="lobby-topbar">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <div class="res-chip" id="lobby-stars">⭐ 0</div>
          <div class="res-chip" id="lobby-best">🏆 --</div>
        </div>
        <button class="gyro-pill" id="btn-lobby-gyro">📱 陀螺仪：关</button>
      </div>

      <div class="hero-emblem">
        <span class="badge-tag">MEOWBALL RUSH · 3D 童话仓鼠球</span>
        <h1 class="lobby-title">魔女猫球</h1>
        <p class="lobby-sub">混元3D手办萌猫 · 渐进立体浮空赛道 · 剩余时间结转！</p>
      </div>

      <div class="lobby-drawer">
        <div class="hub-tabs">
          <button class="htab active" data-tab="tracks">🗺️ 渐进闯关地图</button>
          <button class="htab" data-tab="cats">🐱 猫球衣橱 (<span id="cat-count">1/6</span>)</button>
        </div>

        <!-- Tab 1: Progressive Track Cards -->
        <div class="tab-pane" id="pane-tracks">
          <div class="track-cards" id="track-cards"></div>
          <div class="cta-row">
            <button class="gbtn gbtn-play" id="btn-tourney">🏆 3关锦标赛</button>
            <button class="gbtn gbtn-gold" id="btn-practice">🎯 挑战所选关卡</button>
          </div>
        </div>

        <!-- Tab 2: Cat Wardrobe with Stat Bars -->
        <div class="tab-pane" id="pane-cats" hidden>
          <div class="cat-grid" id="cat-grid"></div>
          <div class="cat-stats-card">
            <div style="font-size:12px;font-weight:900" id="cat-desc">见习小黑猫 · 均衡全能</div>
            <div class="stat-bars" id="cat-bars"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Explicit Pause Modal -->
    <div class="overlay center-overlay" id="pause-screen" hidden style="z-index:40">
      <div class="modal-box">
        <div class="badge-tag">PAUSED · 已暂停</div>
        <h2 style="font-size:24px;font-weight:900;margin-top:8px">🐾 猫球休息一下</h2>
        <div class="slider-row">
          <span>🎚️ 操控灵敏度</span>
          <input type="range" id="sens-slider" min="0.5" max="2.0" step="0.1" value="1.0">
          <span id="sens-val">1.0×</span>
        </div>
        <div class="cta-row" style="flex-direction:column;gap:8px;margin-top:8px">
          <button class="gbtn gbtn-play" id="btn-resume">▶ 继续冲刺</button>
          <button class="gbtn gbtn-gold" id="btn-restart-stage">🔄 重开本关</button>
          <button class="gbtn gbtn-dark" id="btn-pause-gyro">📱 切换/校准手机陀螺仪</button>
          <button class="gbtn gbtn-dark" id="btn-pause-lobby">🏠 返回大厅</button>
        </div>
      </div>
    </div>

    <!-- Stage Clear / Tournament Victory / Time Up Result Modal -->
    <div class="overlay center-overlay" id="result-screen" hidden style="z-index:42">
      <div class="modal-box">
        <div class="badge-tag" id="res-tag">STAGE CLEAR</div>
        <h2 id="res-title" style="font-size:25px;font-weight:900;margin-top:8px">🎉 冲过魔法传送门！</h2>
        <p id="res-sub" style="font-size:12.5px;font-weight:800;color:#6b5582;margin-top:4px">剩余时间已全额结转至下一关！</p>
        <div class="res-stats">
          <div class="res-stat"><div class="k">剩余时间</div><div class="v" id="res-time">32.4s</div></div>
          <div class="res-stat"><div class="k">本局星糖 / 破球</div><div class="v" id="res-stars">⭐ 4 / 💥 0</div></div>
        </div>
        <div class="cta-row">
          <button class="gbtn gbtn-play" id="btn-res-next">下一关 →</button>
          <button class="gbtn gbtn-dark" id="btn-res-lobby" style="flex:0.65">大厅</button>
        </div>
      </div>
    </div>
  </div>
  <!-- GAME_BUNDLE -->
</body>
</html>
